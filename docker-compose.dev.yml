
# Local Postgres + pgAdmin. Reads backend/.env for the database credentials and
# pgadmin.env for the console login, so `cp` both examples before starting.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Pinned to the SAME major as production (Railway managed Postgres 18), so a
# production dump restores here and `ops/restore-drill.sh` proves something true.
# Keep this in step with backup.yml and restore-drill.sh, which both pin 18 too —
# a client older than the server refuses to dump at all.
#
# Postgres will not start on a data directory written by a different major
# version, so moving this pin means dropping the volume first:
#
#   docker compose -f docker-compose.dev.yml down -v
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend && npm run db-init

name: crux-dev
services:
  db:
    image: postgres:18
    container_name: crux-dev-db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - crux_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crux -d cruxdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: crux-dev-pgadmin
    env_file:
      - ./pgadmin.env
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - crux_pgadmin_dev_data:/var/lib/pgadmin

volumes:
  crux_postgres_dev_data:
  crux_pgadmin_dev_data: