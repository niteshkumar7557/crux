<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64">
  <!-- The Crux mark, solid variant. Kept in sync with _components/ui/Logo.tsx.
       An SVG favicon stays crisp at every size a browser asks for, and both
       inks are spelled out here because a favicon has no page to inherit
       currentColor from: forest on cream, flipping to cream on green-black
       when the browser reports a dark UI. -->
  <style>
    .ground { fill: #f3edda; }
    .ink    { fill: #244134; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0f1a15; }
      .ink    { fill: #ece5d0; }
    }
  </style>
  <mask id="brace">
    <rect width="24" height="24" fill="#fff"/>
    <path d="M5.2 20.2L18.4 9.4M18.8 20.2L5.6 9.4"
          stroke="#000" stroke-width="2.15" stroke-linecap="round"/>
  </mask>
  <rect width="24" height="24" class="ground"/>
  <path d="M4 21.4V11a8 8 0 0 1 16 0v10.4z" class="ink" mask="url(#brace)"/>
</svg>
