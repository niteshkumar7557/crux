# Railway service config — crux-backend.
#
# Everything in a service's Build and Deploy settings can live here instead of
# in the dashboard, so a deploy setting is reviewable in a diff like any other
# code. This file is the source of truth; the dashboard mirrors it.
#
# NOTE: Railway does NOT resolve this file relative to the service's Root
# Directory. The path must be set explicitly in service settings as
# `backend/railway.toml`, or it is silently ignored.

[build]
builder = "DOCKERFILE"

[deploy]
# Migrations run in their own container BEFORE the new one serves traffic. A
# failed migration halts the deploy and leaves the previous container running —
# unlike the old `npm start`, which migrated on boot and so crash-looped the
# service instead. The pre-deploy container gets the service's env vars
# (DB_URL is all this needs); it has no volume access, which does not matter
# here because migrations only touch Postgres.
preDeployCommand = ["npm run db:migrate"]

# /health runs SELECT 1 through the pool rather than returning an unconditional
# 200, so "healthy" means a real request would work and a dead Postgres shows up
# as down instead of hiding behind a green check.
healthcheckPath = "/health"
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"

# Exactly one instance. The three in-process pollers (conclusion, featuring,
# season rollover) each run on a setInterval inside this process, and the rate
# limiter counts requests in this process's own memory — at two replicas the
# limits double and the buckets split. See docs/codebase-guide.md §10.
#
# There is no volume any more (avatars live in object storage), so nothing else
# enforces this — the line below is the enforcement. Do not raise it without
# first moving the pollers to a real scheduler and the limiter to Redis.
#
# Note this does NOT cover the deploy window: Railway briefly overlaps the old
# and new containers, so two poller sets can tick at once for a few seconds.
# That is safe because every poller's real guard is in the database, not in the
# `running` flag — concludeDebate re-checks status under SELECT ... FOR UPDATE
# and rolls back before spending an LLM call, and season awards are protected by
# UNIQUE (season_key, rank) with ON CONFLICT DO NOTHING. The in-process flag only
# stops a slow tick from lapping itself.
numReplicas = 1
